<section class="pagina">
  <div class="cabecalho-pagina">
    <h1>Clientes <span class="gs-contagem">{{ total() }}</span></h1>
    <a mat-flat-button class="gs-primario" routerLink="novo">Novo cliente</a>
  </div>

  <div class="filtros barra-gestao" role="search">
    <label class="gs-busca busca-gestao">
      <mat-icon aria-hidden="true">search</mat-icon>
      <input [formControl]="busca" placeholder="Buscar por nome" aria-label="Buscar por nome" />
    </label>
  </div>

  <div>
    @if (carregando()) {
      <mat-progress-bar mode="indeterminate" aria-label="Carregando clientes" />
    }

    @if (!carregando() && clientes().length === 0) {
      <app-estado-vazio mensagem="Nenhum cliente encontrado." icone="people" />
    } @else {
      <table mat-table [dataSource]="clientes()" class="tabela">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let c" class="gs-forte">{{ c.nome }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef class="esconder-sm">E-mail</th>
          <td mat-cell *matCellDef="let c" class="esconder-sm">{{ c.email }}</td>
        </ng-container>
        <ng-container matColumnDef="cpf">
          <th mat-header-cell *matHeaderCellDef class="esconder-md">CPF</th>
          <td mat-cell *matCellDef="let c" class="esconder-md">{{ c.cpf | cpf }}</td>
        </ng-container>
        <ng-container matColumnDef="telefone">
          <th mat-header-cell *matHeaderCellDef class="esconder-md">Telefone</th>
          <td mat-cell *matCellDef="let c" class="esconder-md">{{ c.telefone | telefone }}</td>
        </ng-container>
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef class="celula-acoes"><span class="cdk-visually-hidden">Ações</span></th>
          <td mat-cell *matCellDef="let c" class="celula-acoes">
            <a mat-button class="gs-acao" routerLink="/pedidos" [queryParams]="{ clienteId: c.id }"
               [attr.aria-label]="'Ver pedidos de ' + c.nome">Pedidos</a>
            <a mat-button class="gs-acao" [routerLink]="['edit', c.id]" [attr.aria-label]="'Editar ' + c.nome">Editar</a>
            <button mat-button class="gs-acao gs-perigo" (click)="excluir(c)" [attr.aria-label]="'Excluir ' + c.nome">Excluir</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    }

    <mat-paginator [length]="total()" [pageIndex]="pagina" [pageSize]="tamanho" [pageSizeOptions]="[5, 10, 20]"
                   (page)="mudarPagina($event)" aria-label="Paginação de clientes" />
  </div>
</section>

<section class="pagina">
  <div class="cabecalho-pagina">
    <h1>Cupons de desconto</h1>
    <a mat-flat-button routerLink="novo"><mat-icon aria-hidden="true">add</mat-icon> Novo cupom</a>
  </div>

  <div class="cartao">
    @if (carregando()) {
      <mat-progress-bar mode="indeterminate" aria-label="Carregando cupons" />
    }
    @if (!carregando() && cupons().length === 0) {
      <app-estado-vazio mensagem="Nenhum cupom cadastrado." icone="local_offer" />
    } @else {
      <table mat-table [dataSource]="cupons()" class="tabela">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let c"><strong>{{ c.codigo }}</strong></td>
        </ng-container>
        <ng-container matColumnDef="percentual">
          <th mat-header-cell *matHeaderCellDef>Desconto</th>
          <td mat-cell *matCellDef="let c">{{ c.percentual | number: '1.0-2' }}%</td>
        </ng-container>
        <ng-container matColumnDef="validade">
          <th mat-header-cell *matHeaderCellDef class="esconder-sm">Validade</th>
          <td mat-cell *matCellDef="let c" class="esconder-sm">{{ c.validade + 'T00:00:00' | date: 'dd/MM/yyyy' }}</td>
        </ng-container>
        <ng-container matColumnDef="situacao">
          <th mat-header-cell *matHeaderCellDef>Situação</th>
          <td mat-cell *matCellDef="let c" [class.alerta-estoque]="!c.valido">{{ situacao(c) }}</td>
        </ng-container>
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef class="celula-acoes">Ações</th>
          <td mat-cell *matCellDef="let c" class="celula-acoes">
            <a mat-icon-button [routerLink]="['edit', c.id]" [attr.aria-label]="'Editar cupom ' + c.codigo" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </a>
            <button mat-icon-button (click)="excluir(c)" [attr.aria-label]="'Excluir cupom ' + c.codigo" matTooltip="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    }
  </div>
</section>

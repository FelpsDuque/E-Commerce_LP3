<mat-sidenav-container class="container" (backdropClick)="painel.fechar()">
  <mat-sidenav
    position="end"
    mode="over"
    class="painel-carrinho"
    [opened]="painel.aberto()"
    (closedStart)="painel.fechar()"
    aria-label="Carrinho de compras"
  >
    <app-carrinho />
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="cabecalho">
      <div class="linha-principal">
        <a routerLink="/" class="marca" aria-label="GarboShop — página inicial">GARBOSHOP</a>

        <nav class="nav-principal" aria-label="Navegação principal">
          <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Início</a>
          <a routerLink="/catalogo" routerLinkActive="ativo" ariaCurrentWhenActive="page">Catálogo</a>
          <a routerLink="/pedidos" [class.ativo]="emGestao()">Gestão</a>
        </nav>

        <button
          mat-stroked-button
          class="gs-secundario botao-carrinho"
          (click)="painel.abrir()"
          [attr.aria-label]="'Abrir carrinho com ' + qtdCarrinho() + ' itens'"
        >
          Carrinho ({{ qtdCarrinho() }})
        </button>
      </div>

      @if (emGestao()) {
        <nav class="gs-abas abas-gestao" aria-label="Área de gestão">
          @for (item of gestao; track item.rota) {
            <a [routerLink]="item.rota" routerLinkActive="ativa" ariaCurrentWhenActive="page">{{ item.rotulo }}</a>
          }
        </nav>
      }
    </header>

    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

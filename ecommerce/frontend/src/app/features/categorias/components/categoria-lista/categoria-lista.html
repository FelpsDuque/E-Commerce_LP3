<section class="pagina">
  <div class="cabecalho-pagina">
    <h1>Categorias</h1>
    <a mat-flat-button routerLink="novo">
      <mat-icon aria-hidden="true">add</mat-icon> Nova categoria
    </a>
  </div>

  <div class="cartao">
    @if (carregando()) {
      <mat-progress-bar mode="indeterminate" aria-label="Carregando categorias" />
    }

    @if (!carregando() && categorias().length === 0) {
      <app-estado-vazio mensagem="Nenhuma categoria cadastrada." icone="category" />
    } @else {
      <table mat-table [dataSource]="categorias()" class="tabela">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let c">{{ c.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef class="esconder-sm">Descrição</th>
          <td mat-cell *matCellDef="let c" class="esconder-sm texto-secundario">{{ c.descricao }}</td>
        </ng-container>

        <ng-container matColumnDef="quantidadeProdutos">
          <th mat-header-cell *matHeaderCellDef>Produtos</th>
          <td mat-cell *matCellDef="let c">{{ c.quantidadeProdutos }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef class="celula-acoes">Ações</th>
          <td mat-cell *matCellDef="let c" class="celula-acoes">
            <a mat-icon-button [routerLink]="['edit', c.id]" [attr.aria-label]="'Editar ' + c.nome" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </a>
            <button mat-icon-button (click)="excluir(c)" [attr.aria-label]="'Excluir ' + c.nome" matTooltip="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    }
  </div>
</section>
